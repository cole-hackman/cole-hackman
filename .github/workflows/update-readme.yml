name: Update README

on:
  schedule:
    - cron: "0 13 * * *" # daily, ~6am Pacific
  workflow_dispatch:
  push:
    branches: [main]
    paths: [build-svg.mjs, .github/workflows/update-readme.yml]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate chat.svg
        run: node build-svg.mjs
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chat.svg
          git diff --cached --quiet || (git commit -m "Update chat.svg" && git push)
