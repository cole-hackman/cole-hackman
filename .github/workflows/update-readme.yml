name: Update README

on:
  schedule:
    - cron: "0 13 * * *" # daily, ~6am Pacific
  workflow_dispatch:
  push:
    branches: [main]
    paths: [build-svg.mjs, .github/workflows/update-readme.yml]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate chat.svg
        run: node build-svg.mjs
      # raw.githubusercontent.com caches by path and ignores query strings, so
      # publish each version under a new path to make sure viewers get it.
      - name: Publish versioned copy
        run: |
          v=$(sha256sum chat.svg | cut -c1-12)
          rm -rf chat && mkdir chat && cp chat.svg "chat/$v.svg"
          sed -i -E "s#src=\"[^\"]*chat[^\"]*\.svg[^\"]*\"#src=\"https://raw.githubusercontent.com/${{ github.repository }}/main/chat/$v.svg\"#" README.md
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A chat.svg chat README.md
          git diff --cached --quiet || (git commit -m "Update chat.svg" && git push)
