name: Update README

on:
  schedule:
    - cron: "0 13 * * *" # daily, ~6am Pacific
  workflow_dispatch:
  push:
    branches: [main]
    paths: [build-svg.mjs, build-activity.mjs, .github/workflows/update-readme.yml]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate chat.svg
        run: node build-svg.mjs
      # If the GitHub API is down, keep yesterday's activity.svg instead of
      # blocking the chat update.
      - name: Generate activity.svg
        run: node build-activity.mjs
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # raw.githubusercontent.com caches by path and ignores query strings, so
      # publish each version under a new path to make sure viewers get it.
      - name: Publish versioned copies
        run: |
          for name in chat activity; do
            v=$(sha256sum "$name.svg" | cut -c1-12)
            rm -rf "$name" && mkdir "$name" && cp "$name.svg" "$name/$v.svg"
            sed -i -E "s#src=\"[^\"]*/$name/[^\"]*\.svg\"#src=\"https://raw.githubusercontent.com/${{ github.repository }}/main/$name/$v.svg\"#" README.md
          done
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A chat.svg chat activity.svg activity README.md
          git diff --cached --quiet || (git commit -m "Update chat.svg and activity.svg" && git push)
